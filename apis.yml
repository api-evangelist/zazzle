aid: zazzle
name: Zazzle
description: >-
  Zazzle is an online marketplace and on-demand manufacturing platform where independent designers,
  brands and shoppers create and buy customized physical products — invitations, cards, apparel,
  mugs, signage, business products and hundreds of other made-to-order goods. Zazzle exposes three
  distinct public integration surfaces rather than one general-purpose REST API: the Create-a-Product
  API, a URL "linkover" contract that injects a partner site's images and text into a Zazzle product
  template and returns a purchasable product (or a whole "Templates Buffet" of them); the RealView
  image service, which renders a dynamic product mockup of that same template for preview on the
  partner's own page; and the partner-gated Vendor (Maker) API, an XML RPC endpoint that Zazzle
  manufacturing partners use to pull new orders, acknowledge them, fetch packing sheets and print
  files, and buy or void Zazzle-issued shipping labels. The Create-a-Product surface is monetized
  through the Zazzle Associates/Ambassador program, with partners setting their own royalty and
  earning a referral share on each sale.
