- from: MemberAccount
  to: Associate
  type: has_one
  via: at -> rf
  confidence: medium
  note: >-
    Zazzle documents `at` and `rf` as distinct 18-digit IDs and its own example link uses the SAME
    value for both, so the exact cardinality between account and associate identity is not stated.
- from: Order
  to: PackingSheet
  type: has_many
  via: orderid + page
  confidence: high
- from: Order
  to: ShippingLabel
  type: has_one
  via: orderid
  confidence: high
- from: ShippingLabel
  to: Order
  type: belongs_to
  via: tracking
  confidence: medium
  note: >-
    `voidshippinglabel` is keyed by tracking number rather than order id, implying tracking is
    globally unique across labels.
cross_surface_note: >-
  The Create-a-Product/RealView entity graph (accounts, stores, categories, templates) and the Vendor
  entity graph (orders, packing sheets, labels) share NO identifier. There is no public API path from
  a generated product to the order it produced, or from an order back to the template that made it —
  the design side and the fulfillment side of Zazzle are two disconnected public graphs.
not_modelled:
- Vendor API response payload schemas (Order line items, addresses, print files, previews) — Zazzle
  does not publish them and no authenticated sample is held.
- Product catalog taxonomy (the 350+ product types) — no public API exposes it.
