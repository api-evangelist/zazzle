summary: >-
  Zazzle publishes no API versioning policy, no deprecation policy, no SLA, no status page and no
  changelog. Version information exists only as a document revision on the Create-a-Product guide and
  as a frozen path segment on the Vendor API. The Create-a-Product API's current published guide is
  v3.0, dated September 2019 — the newest first-party API documentation API Evangelist could locate
  for any Zazzle surface.
