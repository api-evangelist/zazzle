summary: >-
  Zazzle operates no sandbox, no test mode, and no test/live key separation. What it does publish —
  and what is captured verbatim below — is a live, public reference store with real template product
  IDs and fully-formed working example linkovers, which a developer can call before owning any Zazzle
  account of their own. Every value here is transcribed verbatim from Zazzle's published API guide;
  none was invented.
test_mode:
  separate_environment: false
  key_prefixes: null
  test_clock: false
  fixtures: false
  note: >-
    There is no zazzle sandbox host, no test-mode credential, and no way to exercise the
    Create-a-Product flow without producing a genuinely purchasable product. Calls go to production.
