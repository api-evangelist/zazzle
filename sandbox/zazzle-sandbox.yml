tooling:
  link_builder:
    url: https://www.zazzle.com/my/associate/create
    description: >-
      Zazzle's in-account link building tool, which generates both Template Links (1 to 1) and
      Templates Buffet links (1 to many) and offers "Try link now" / "Preview in a new window"
      test actions. Requires a Zazzle account.
    note: >-
      The store ID (`sr`) is documented as obtainable ONLY through this tool, so a fully manual
      1-to-many integration cannot be built without signing in.
vendor_api:
  sandbox: false
  note: >-
    The Vendor (Maker) API has no test environment and no test vendor id. It cannot be exercised at
    all without Zazzle-issued Maker credentials. The only anonymous behaviour available is the
    parameter validator, which is what API Evangelist used to confirm the method surface.
caveats:
- >-
  Propagation delay — a newly created store category or template can take up to 24 hours to become
  usable by the API.
- Templates are immutable once posted for sale; iterating on a design means creating a new product.
- Templates used by the Templates Buffet flow must be set Public and G-Rated.
